name: AnkiVoice
options:
  bundleIdPrefix: local.ankivoice
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: 0.15.7
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: KQHSQY486C
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    CURRENT_PROJECT_VERSION: "25"
    MARKETING_VERSION: "0.2.0"
    DEVELOPMENT_LANGUAGE: en
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  AnkiVoice:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
        optional: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: AnkiVoice
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: "Your microphone is used during hands-free study so the app can detect answers and voice commands. Audio never leaves your device."
        NSSpeechRecognitionUsageDescription: "Speech recognition runs on-device to recognize your spoken answers and commands like Again, Hard, Good, and Easy."
        NSLocalNetworkUsageDescription: "AnkiVoice connects to Anki on your computer over your local network to import decks through the AnkiConnect add-on."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        NSPrivacyAccessedAPITypes:
          - NSPrivacyAccessedAPIType: NSPrivacyAccessedAPICategoryUserDefaults
            NSPrivacyAccessedAPITypeReasons:
              - CA92.1
          - NSPrivacyAccessedAPIType: NSPrivacyAccessedAPICategoryFileTimestamp
            NSPrivacyAccessedAPITypeReasons:
              - C617.1
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Anki Deck Package
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - net.ankiweb.apkg
              - net.ankiweb.colpkg
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.ankiweb.apkg
            UTTypeDescription: Anki Deck Package
            UTTypeConformsTo:
              - public.data
              - public.archive
            UTTypeTagSpecification:
              public.filename-extension:
                - apkg
          - UTTypeIdentifier: net.ankiweb.colpkg
            UTTypeDescription: Anki Collection Package
            UTTypeConformsTo:
              - public.data
              - public.archive
            UTTypeTagSpecification:
              public.filename-extension:
                - colpkg
    dependencies:
      - package: FluidAudio
        product: FluidAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hyperbox.ankivoice
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        SWIFT_OBJC_BRIDGING_HEADER: App/Sources/Support/AnkiVoice-Bridging-Header.h
        # XcodeGen otherwise marks the app as iPhone+iPad. Without an iPad
        # orientation key, App Store Connect marks the binary Invalid.
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
        # Release is the configuration that gets archived for TestFlight and
        # the App Store. Automatic signing can't produce that archive here —
        # the team has no registered devices, so it fails trying to mint a
        # development profile — so Release names the distribution profile
        # outright. XcodeGen's iOS preset would otherwise leave the legacy
        # "iPhone Developer" identity on the target.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "AnkiVoice App Store Distribution"
  AnkiVoiceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: AnkiVoice
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: local.ankivoice.tests
  AnkiVoiceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: AnkiVoice
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: local.ankivoice.uitests
        TEST_TARGET_NAME: AnkiVoice
schemes:
  AnkiVoice:
    build:
      targets:
        AnkiVoice: all
        AnkiVoiceTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AnkiVoiceTests
        - AnkiVoiceUITests
